[project]
name = "dagster-snowflake-etl"
version = "0.1.0"
description = "Dagster ETL pipeline for Snowflake with Kimball-style layered architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",
    "dagster-snowflake>=0.22.0",
    "snowflake-connector-python>=3.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "dagster-webserver>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "dagster_snowflake_etl.definitions"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
